<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vapi Outbound Caller</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
      padding: 40px 16px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
    p.sub { margin: 0 0 24px; font-size: 14px; color: #94a3b8; }

    label { display: block; font-size: 13px; margin-bottom: 8px; color: #cbd5e1; }

    input[type="tel"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f1f5f9;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="tel"]:focus { border-color: #6366f1; }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button:hover:not(:disabled) { background: #4f46e5; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .status {
      margin-top: 24px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      border: 1px solid #334155;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: #64748b; }
    .status.idle .dot { background: #64748b; }
    .status.calling .dot { background: #f59e0b; animation: pulse 1s infinite; }
    .status.connected .dot { background: #22c55e; animation: pulse 1.4s infinite; }
    .status.ended .dot { background: #3b82f6; }
    .status.error .dot { background: #ef4444; }
    .status.error { border-color: #7f1d1d; color: #fca5a5; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .status-label { font-weight: 600; }
    .status-detail { color: #94a3b8; font-weight: 400; }

    .panel {
      margin-top: 20px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      overflow: hidden;
    }
    .panel-head {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
      background: #16213a;
    }
    .panel-body { padding: 14px; font-size: 14px; line-height: 1.5; }

    #transcript { max-height: 280px; overflow-y: auto; }
    .turn { margin-bottom: 12px; }
    .turn:last-child { margin-bottom: 0; }
    .turn .who { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
    .turn.assistant .who { color: #818cf8; }
    .turn.user .who { color: #34d399; }
    .turn .text { color: #e2e8f0; }
    .empty { color: #64748b; font-style: italic; }
    #summary .panel-body { color: #cbd5e1; white-space: pre-wrap; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Vapi Outbound Caller</h1>
    <p class="sub">Enter a phone number and place an AI call.</p>

    <label for="phone">Phone number (international format)</label>
    <input type="tel" id="phone" placeholder="+1XXXXXXXXXX" autocomplete="tel" />

    <button id="callBtn">Call</button>

    <div class="status idle" id="status">
      <span class="dot"></span>
      <span><span class="status-label">Idle</span><span class="status-detail" id="statusDetail"></span></span>
    </div>

    <div class="panel hidden" id="transcriptPanel">
      <div class="panel-head">Live Transcript</div>
      <div class="panel-body" id="transcript"><span class="empty">Waiting for conversation…</span></div>
    </div>

    <div class="panel hidden" id="summary">
      <div class="panel-head">Call Summary</div>
      <div class="panel-body" id="summaryBody"><span class="empty">Summary appears after the call ends…</span></div>
    </div>
  </div>

  <script>
    const phoneInput = document.getElementById("phone");
    const callBtn = document.getElementById("callBtn");
    const statusEl = document.getElementById("status");
    const statusLabel = statusEl.querySelector(".status-label");
    const statusDetail = document.getElementById("statusDetail");
    const transcriptPanel = document.getElementById("transcriptPanel");
    const transcriptEl = document.getElementById("transcript");
    const summaryPanel = document.getElementById("summary");
    const summaryBody = document.getElementById("summaryBody");

    let pollTimer = null;
    let postEndPolls = 0;          // how many times we've polled after the call ended
    const MAX_POST_END_POLLS = 12; // keep checking ~30s for the summary to populate

    function setStatus(state, label, detail = "") {
      statusEl.className = "status " + state;
      statusLabel.textContent = label;
      statusDetail.textContent = detail ? " — " + detail : "";
    }

    // Map Vapi call status -> our UI state/label
    function uiFromVapiStatus(s) {
      switch (s) {
        case "queued":     return ["calling",   "Calling",        "Queued"];
        case "ringing":    return ["calling",   "Calling",        "Ringing"];
        case "in-progress":return ["connected", "Call Connected", "In progress"];
        case "forwarding": return ["connected", "Call Connected", "Forwarding"];
        case "ended":      return ["ended",     "Call Ended",     ""];
        default:           return ["calling",   "Calling",        s || ""];
      }
    }

    function renderTranscript(call) {
      // Vapi exposes turns in `messages` (live-ish) and `artifact.messages` (final).
      const msgs = (call.artifact && call.artifact.messages) || call.messages || [];
      const turns = msgs.filter(m => m.role === "assistant" || m.role === "user" || m.role === "bot");

      if (!turns.length) {
        // Fall back to the plain transcript string if present
        const t = (call.artifact && call.artifact.transcript) || call.transcript;
        transcriptEl.innerHTML = t
          ? '<div class="turn"><div class="text"></div></div>'
          : '<span class="empty">Waiting for conversation…</span>';
        if (t) transcriptEl.querySelector(".text").textContent = t;
        return;
      }

      transcriptEl.innerHTML = "";
      for (const m of turns) {
        const role = m.role === "bot" ? "assistant" : m.role;
        const text = m.message || m.content || "";
        if (!text) continue;
        const div = document.createElement("div");
        div.className = "turn " + role;
        const who = document.createElement("div");
        who.className = "who";
        who.textContent = role === "assistant" ? "Assistant" : "Caller";
        const txt = document.createElement("div");
        txt.className = "text";
        txt.textContent = text;
        div.appendChild(who);
        div.appendChild(txt);
        transcriptEl.appendChild(div);
      }
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function renderSummary(call) {
      const summary =
        (call.analysis && call.analysis.summary) || call.summary || "";
      if (summary) {
        summaryBody.textContent = summary;
      } else {
        summaryBody.innerHTML = '<span class="empty">No summary was generated for this call.</span>';
      }
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    async function pollCall(id) {
      try {
        const res = await fetch("/call-status?id=" + encodeURIComponent(id));
        const call = await res.json().catch(() => ({}));
        if (!res.ok) return; // transient; try again next tick

        const [state, label, detail] = uiFromVapiStatus(call.status);
        setStatus(state, label, detail);
        renderTranscript(call);

        if (call.status === "ended") {
          summaryPanel.classList.remove("hidden");
          const reason = call.endedReason ? "Ended — " + call.endedReason : "";
          setStatus("ended", "Call Ended", reason);
          callBtn.disabled = false;

          const summary = (call.analysis && call.analysis.summary) || call.summary;
          if (summary) {
            // Summary is ready — render it and stop polling.
            renderSummary(call);
            stopPolling();
          } else if (postEndPolls >= MAX_POST_END_POLLS) {
            // Gave Vapi enough time; no summary was produced.
            summaryBody.innerHTML = '<span class="empty">No summary was generated for this call.</span>';
            stopPolling();
          } else {
            // Vapi generates the summary a few seconds after the call ends — keep waiting.
            postEndPolls++;
            summaryBody.innerHTML = '<span class="empty">Generating summary…</span>';
          }
        }
      } catch (_) {
        /* ignore transient poll errors */
      }
    }

    async function placeCall() {
      const number = phoneInput.value.trim();
      if (!/^\+[1-9]\d{6,14}$/.test(number)) {
        setStatus("error", "Error", "Enter a valid number in international format, e.g. +1XXXXXXXXXX");
        return;
      }

      stopPolling();
      postEndPolls = 0;
      callBtn.disabled = true;
      setStatus("calling", "Calling", "Placing the call…");
      transcriptPanel.classList.remove("hidden");
      transcriptEl.innerHTML = '<span class="empty">Waiting for conversation…</span>';
      summaryPanel.classList.add("hidden");
      summaryBody.innerHTML = '<span class="empty">Summary appears after the call ends…</span>';

      try {
        const res = await fetch("/call", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ number })
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok || !data.id) {
          const msg = data.message || data.error || ("Request failed (" + res.status + ")");
          setStatus("error", "Error", Array.isArray(msg) ? msg.join(", ") : msg);
          callBtn.disabled = false;
          return;
        }

        setStatus("calling", "Calling", "Call ID: " + data.id);
        // Start polling the live call state.
        pollCall(data.id);
        pollTimer = setInterval(() => pollCall(data.id), 2500);

      } catch (err) {
        setStatus("error", "Error", err.message || "Network error");
        callBtn.disabled = false;
      }
    }

    callBtn.addEventListener("click", placeCall);
    phoneInput.addEventListener("keydown", (e) => { if (e.key === "Enter") placeCall(); });
  </script>
</body>
</html>
